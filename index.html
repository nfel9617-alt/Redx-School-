<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDX SCHOOL - الإدارة السحابية</title>
    
    <link rel="manifest" href="admin_manifest.json">
    <meta name="theme-color" content="#e62020">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --bg-color: #0f1115;
            --card-color: #1a1d24;
            --primary-red: #e62020;
            --text-light: #f3f4f6;
            --border-color: #2d3748;
            --success: #10b981;
        }

        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background-color: var(--card-color);
            height: 100vh;
            padding: 20px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
        }

        .logo { text-align: center; font-size: 28px; font-weight: 900; margin-bottom: 30px; }
        .logo span { color: var(--primary-red); }

        .sidebar-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: none;
            background: var(--bg-color);
            color: white;
            cursor: pointer;
            font-family: 'Tajawal';
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .sidebar-btn:hover { background: #2d3748; }
        #installBtn { background: var(--primary-red); display: none; margin-top: auto; }

        /* المحتوى */
        .main-content { flex: 1; padding: 30px; box-sizing: border-box; }
        
        .dashboard-cards { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background-color: var(--card-color); padding: 20px; border-radius: 12px; flex: 1; border-bottom: 4px solid var(--primary-red); }
        .card p { margin: 5px 0 0 0; font-size: 28px; font-weight: 900; }

        .controls { background: var(--card-color); padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        
        input {
            padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color);
            color: white; border-radius: 8px; flex: 1; min-width: 180px; font-family: 'Tajawal';
        }

        table { width: 100%; border-collapse: collapse; background: var(--card-color); border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border-color); }
        th { background: #222630; color: var(--primary-red); }

        .status-paid { color: var(--success); font-weight: bold; }
        .status-unpaid { color: var(--primary-red); font-weight: bold; }

        /* لودر التحميل */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center;
            justify-content: center; z-index: 9999; flex-direction: column;
        }
        .spin { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-red); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loader"><div class="spin"></div><p>جاري تحديث البيانات...</p></div>

    <div class="sidebar">
        <div class="logo">REDX <span>SCHOOL</span></div>
        <button class="sidebar-btn" onclick="loadData()">🔄 تحديث البيانات</button>
        <button id="installBtn" class="sidebar-btn">📲 تنزيل التطبيق</button>
    </div>

    <div class="main-content">
        <div class="dashboard-cards">
            <div class="card"><h3>إجمالي التلاميذ</h3><p id="totalS">0</p></div>
            <div class="card"><h3>غير دافعين</h3><p id="unpaidS" style="color:var(--primary-red)">0</p></div>
        </div>

        <div class="controls">
            <div class="form-row">
                <input type="text" id="name" placeholder="اسم التلميذ">
                <input type="text" id="phone" placeholder="رقم الهاتف">
                <input type="text" id="teacher" placeholder="الأستاذ">
                <input type="text" id="subject" placeholder="المادة">
                <button onclick="addStudent()" style="padding:12px 25px; background:var(--primary-red); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">➕ إضافة</button>
            </div>
            <input type="text" id="search" onkeyup="render()" placeholder="🔍 ابحث عن اسم تلميذ..." style="width:100%">
        </div>

        <table>
            <thead>
                <tr>
                    <th>التلميذ</th>
                    <th>الأستاذ</th>
                    <th>المادة</th>
                    <th>الحصص</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzkzPkksCMP865gqV7pabniss5wuCVL5wZp54Z9JrjNbfUYOuobrDDDiPkE0HLXFL8H7A/exec';
        let dataList = [];

        async function loadData() {
            document.getElementById('loader').style.display = 'flex';
            try {
                let res = await fetch(API_URL);
                dataList = await res.json();
                render();
            } catch (e) { alert("خطأ في الاتصال"); }
            document.getElementById('loader').style.display = 'none';
        }

        function render() {
            let search = document.getElementById('search').value.toLowerCase();
            let html = '';
            let unpaid = 0;
            dataList.forEach(s => {
                if(s.name.toLowerCase().includes(search)) {
                    let isPaid = (s.isPaid === true || s.isPaid === 'true');
                    if(!isPaid) unpaid++;
                    html += `<tr>
                        <td>${s.name}</td>
                        <td>${s.teacher}</td>
                        <td>${s.subject}</td>
                        <td>${s.sessions}</td>
                        <td class="${isPaid ? 'status-paid':'status-unpaid'}">${isPaid ? 'مدفوع':'غير مدفوع'}</td>
                        <td>
                            <button onclick="action('add_session', ${s.rowIndex})">+ حصة</button>
                            <button onclick="action('toggle_payment', ${s.rowIndex})">دفع/إلغاء</button>
                        </td>
                    </tr>`;
                }
            });
            document.getElementById('tableBody').innerHTML = html;
            document.getElementById('totalS').innerText = dataList.length;
            document.getElementById('unpaidS').innerText = unpaid;
        }

        async function addStudent() {
            let n = document.getElementById('name').value;
            if(!n) return alert("الاسم مطلوب");
            document.getElementById('loader').style.display = 'flex';
            await fetch(API_URL, { method: 'POST', body: new URLSearchParams({
                action: 'add', name: n, phone: document.getElementById('phone').value,
                teacher: document.getElementById('teacher').value, subject: document.getElementById('subject').value
            })});
            loadData();
        }

        async function action(type, row) {
            document.getElementById('loader').style.display = 'flex';
            await fetch(API_URL, { method: 'POST', body: new URLSearchParams({ action: type, rowIndex: row })});
            loadData();
        }

        // كود تثبيت التطبيق
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'flex';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.onload = loadData;
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
